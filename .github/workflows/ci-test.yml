name: CI Test

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }} - Rails ${{ matrix.rails }}

    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "2.6"
          - "2.7"
          - "3.0"
          - "3.1"
          - "3.2"
          - "3.3"
          - "3.4"

        rails:
          - "5.0"
          - "5.1"
          - "5.2"
          - "6.0"
          - "6.1"
          - "7.0"
          - "7.1"
          - "7.2"
          - "8.0"
          - "8.1"

        exclude:
          - ruby: "2.6"
            rails: "7.0"
          - ruby: "2.6"
            rails: "7.1"
          - ruby: "2.6"
            rails: "7.2"
          - ruby: "2.6"
            rails: "8.0"
          - ruby: "2.6"
            rails: "8.1"

          - ruby: "3.0"
            rails: "5.0"
          - ruby: "3.0"
            rails: "5.1"
          - ruby: "3.0"
            rails: "5.2"

          - ruby: "3.1"
            rails: "5.0"
          - ruby: "3.1"
            rails: "5.1"
          - ruby: "3.1"
            rails: "5.2"

          - ruby: "3.2"
            rails: "5.0"
          - ruby: "3.2"
            rails: "5.1"
          - ruby: "3.2"
            rails: "5.2"

          - ruby: "3.3"
            rails: "5.0"
          - ruby: "3.3"
            rails: "5.1"
          - ruby: "3.3"
            rails: "5.2"

          - ruby: "3.4"
            rails: "5.0"
          - ruby: "3.4"
            rails: "5.1"
          - ruby: "3.4"
            rails: "5.2"

    env:
      BUNDLE_GEMFILE: .github/workflows/gemfiles/${{ matrix.rails }}.gemfile


    steps:
      - uses: actions/checkout@v3
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Install gems
        run: bundle install
      - name: Report Test results to CodeClimate
        uses: paambaati/codeclimate-action@v3.2.0
        env:
          CC_TEST_REPORTER_ID: ${{ secrets.CC_TEST_REPORTER_ID }}
        with:
          coverageCommand: bundle exec rspec


